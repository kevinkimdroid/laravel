<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Outer gold ring -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#D4AF37" stroke-width="3"/>
  
  <!-- Middle gold ring -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="#D4AF37" stroke-width="3"/>
  
  <!-- Black 8-ball -->
  <circle cx="50" cy="50" r="25" fill="#000000" stroke="#D4AF37" stroke-width="1.5"/>
  
  <!-- Number 8 in gold -->
  <text x="50" y="58" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#D4AF37" text-anchor="middle">8</text>
</svg>
